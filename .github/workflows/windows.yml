name: Windows

on:
  push:
    branches: [main, master, "claude/**"]
    # Pushing a version tag (e.g. v0.1.0) also publishes a GitHub Release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache libmpv and ffmpeg
        uses: actions/cache@v4
        with:
          path: packaging/deps
          key: deps-${{ hashFiles('packaging/package.ps1') }}-v1

      - name: Download libmpv and ffmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./packaging/package.ps1 -Stage deps

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        shell: pwsh
        env:
          DROPREEL_REQUIRE_FFMPEG: "1"
        run: |
          # The integration tests use the downloaded ffmpeg/ffprobe for real encodes.
          $env:PATH = "$PWD\packaging\deps;$env:PATH"
          cargo test --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build release and package
        shell: pwsh
        run: |
          ./packaging/package.ps1 -Stage build
          ./packaging/package.ps1 -Stage package

      - uses: actions/upload-artifact@v4
        with:
          name: DropReel-win64
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          test -f "docs/release-notes/$GITHUB_REF_NAME.md" || { echo "::error::Missing docs/release-notes/$GITHUB_REF_NAME.md"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: DropReel-win64
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip *-setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: DropReel ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
