[package]
name = "dropreel"
version = "0.1.1"
edition = "2024"
description = "A Windows movie library and player"
license = "MIT"
repository = "https://github.com/alister-o7/dropreel"
build = "build.rs"

[[bin]]
name = "DropReel"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query"] }
trash = "5"
rfd = "0.17"
opener = { version = "0.9", features = ["reveal"] }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
blake3 = "1"
walkdir = "2"
rayon = "1"
crossbeam-channel = "0.5"
fs4 = "1"
which = "8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
